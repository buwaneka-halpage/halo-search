name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$(cat VERSION)" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))"
            exit 1
          fi
          scripts/build.sh --zip

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Installing:** unzip, move *Halo Search.app* to Applications, then open **System Settings → Privacy & Security → Open Anyway** on first launch (builds are not notarised yet).
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/HaloSearch-*.zip --title "Halo Search ${GITHUB_REF_NAME#v}" --notes-file notes.md
