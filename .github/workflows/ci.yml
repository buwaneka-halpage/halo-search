name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: scripts/build.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: HaloSearch-${{ github.sha }}
          path: build/HaloSearch-*.zip
          retention-days: 14
